# Release everything from one `vX.Y.Z` tag (create it with `scripts/release.py bump X.Y.Z`, which also
# dates the CHANGELOG.md entry that becomes the release notes):
#
#   verify ─┬─ test ───────────────┬─ github-release ── publish-zed-extension
#           └─ build-bundle-ls (5) ┘
#
# Pre-release tags (`v1.2.0-rc.1`) stop after the GitHub release, which is marked as a
# pre-release (the extension only downloads full releases).
#
# Updating the Zed extension registry is opt-in through a repository variable:
#   PUBLISH_ZED_EXTENSION=true  PR to zed-industries/extensions from a fork (vars.ZED_EXTENSIONS_FORK),
#                               token secrets.ZED_EXTENSIONS_TOKEN (classic; scopes: repo, workflow).
#                               The action only updates a listed extension: the first submission
#                               must be a manual PR.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches every manifest
        run: python3 scripts/release.py check --tag "$GITHUB_REF"
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build-bundle-ls:
    needs: verify
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: servers/databricks-bundle-ls
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=databricks-bundle-ls
          [[ "${{ matrix.target }}" == *windows* ]] && bin=$bin.exe
          # Asset names must match `bundle_schema::release_target` in src/; the binary sits at the
          # archive root because the extension unpacks it into a versioned directory.
          tar -czf databricks-bundle-ls-${{ matrix.target }}.tar.gz \
            -C servers/databricks-bundle-ls/target/${{ matrix.target }}/release $bin
      - name: Smoke test
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          mkdir smoke && tar -xzf databricks-bundle-ls-${{ matrix.target }}.tar.gz -C smoke
          smoke/databricks-bundle-ls --version | grep -q "databricks-bundle-ls ${{ needs.verify.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-ls-${{ matrix.target }}
          path: databricks-bundle-ls-${{ matrix.target }}.tar.gz

  github-release:
    needs: [verify, test, build-bundle-ls]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release.py notes "${{ needs.verify.outputs.version }}" > release-notes.md
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          body_path: release-notes.md

  publish-zed-extension:
    needs: [verify, github-release]
    if: needs.verify.outputs.prerelease == 'false' && vars.PUBLISH_ZED_EXTENSION == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: huacnlee/zed-extension-action@v2
        with:
          extension-name: databricks
          push-to: ${{ vars.ZED_EXTENSIONS_FORK }}
        env:
          COMMITTER_TOKEN: ${{ secrets.ZED_EXTENSIONS_TOKEN }}
