# Builds databricks-bundle-ls for every platform the extension downloads it for, on `v*` tags.
# Asset names must match `bundle_schema::release_target` in src/.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: servers/databricks-bundle-ls
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin=databricks-bundle-ls
          [[ "${{ matrix.target }}" == *windows* ]] && bin=$bin.exe
          # The binary sits at the archive root: the extension unpacks it into a versioned directory.
          tar -czf databricks-bundle-ls-${{ matrix.target }}.tar.gz \
            -C servers/databricks-bundle-ls/target/${{ matrix.target }}/release $bin
      - uses: actions/upload-artifact@v7
        with:
          name: databricks-bundle-ls-${{ matrix.target }}
          path: databricks-bundle-ls-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: databricks-bundle-ls-*.tar.gz
          generate_release_notes: true
