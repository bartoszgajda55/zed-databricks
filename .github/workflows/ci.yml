name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml to test the tagged commit.
  workflow_call:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: databricks/setup-cli@v1.17.0
      - run: uv sync
      - name: Lint and type-check
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run basedpyright
      # Snippets, templates, stubs, local Spark integration and the MCP server (fake CLI).
      - run: uv run pytest

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            servers/databricks-bundle-ls
      - uses: databricks/setup-cli@v1.17.0
      - name: Extension (wasm)
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo build --release --target wasm32-wasip2
          cargo test
      - name: databricks-bundle-ls
        working-directory: servers/databricks-bundle-ls
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
