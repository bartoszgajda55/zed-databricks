id = "databricks"
name = "Databricks"
version = "0.2.2"
schema_version = 1
authors = ["Bartosz Gajda <bartek.g55@gmail.com>"]
description = "Databricks Declarative Automation Bundles: schema completion and validation diagnostics for bundle YAML, plus snippets for bundles and Spark Declarative Pipelines. Community project, not affiliated with Databricks."
repository = "https://github.com/bartoszgajda55/zed-databricks"

snippets = ["./snippets/yaml.json", "./snippets/python.json", "./snippets/sql.json"]

# `databricks bundle validate` as diagnostics (servers/databricks-bundle-ls). It only acts on
# YAML files inside a bundle (a directory tree with databricks.yml) and stays idle elsewhere.
[language_servers.databricks-bundle-ls]
name = "Databricks Bundle LS"
languages = ["YAML"]

# Only the two Databricks CLI invocations used to generate the bundle schema.
[[capabilities]]
kind = "process:exec"
command = "databricks"
args = ["--version"]

[[capabilities]]
kind = "process:exec"
command = "databricks"
args = ["bundle", "schema"]

# Prebuilt databricks-bundle-ls binaries from this repository's GitHub releases.
[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["bartoszgajda55", "zed-databricks", "**"]
