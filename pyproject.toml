# Python tooling for developing this extension (tests + local Spark / SDP smoke checks).
# The extension itself ships no Python. Set up with: scripts/dev-setup.sh
[project]
name = "zed-databricks-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "jsonschema>=4.23",
    "pyyaml>=6",
    "regex>=2026.9.29",
    "pyspark[connect]>=4.2.1",
    "chispa>=0.10",
    "basedpyright>=1.40.2",
    "ruff>=0.17.3",
    "databricks-sdk>=0.158.0",
    "debugpy>=1.8.22",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PYI"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
# Stubs are copied into user projects, which may run Python < 3.12 (no `type` statement).
"project-template/typings/**" = ["UP040"]
# Templates carry `noqa`s for Ruff's default rules, which users' projects run (CI checks
# them with `ruff check --isolated`) but this configuration doesn't select.
"project-template/**" = ["RUF100"]

[tool.ruff.lint.isort]
known-first-party = ["dap_client", "runner_module", "zed_snippet"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["scripts", "tests", "project-template/.zed"]
exclude = ["**/fixtures", "**/.venv"]
extraPaths = ["tests"]
