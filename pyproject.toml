# Python tooling for developing this extension (tests + local Spark / SDP smoke checks).
# The extension itself ships no Python. Set up with: scripts/dev-setup.sh
[project]
name = "zed-databricks-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "pyyaml>=6",
    "regex>=2024.11",
    "pyspark[connect]>=4.1",
    "chispa>=0.10",
    "databricks-dev-mcp",
    "pytest-asyncio>=1.4",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
databricks-dev-mcp = { workspace = true }

[tool.uv.workspace]
members = [
    "servers/databricks-dev-mcp",
]

[tool.pytest.ini_options]
testpaths = ["tests", "servers/databricks-dev-mcp/tests"]
asyncio_mode = "auto"
