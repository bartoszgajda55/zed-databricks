# Python tooling for developing this extension (tests + local Spark / SDP smoke checks).
# The extension itself ships no Python. Set up with: scripts/dev-setup.sh
[project]
name = "zed-databricks-dev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4.23",
    "pyyaml>=6",
    "regex>=2024.11",
    "pyspark[connect]>=4.1",
    "chispa>=0.10",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
