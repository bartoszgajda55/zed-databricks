[package]
name = "zed-databricks"
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"

# `zed: install dev extension` builds the debug profile. Incremental compilation takes file
# locks that fail when Zed on Windows builds from a `\\wsl.localhost\...` path, and this crate
# is small enough not to need it.
[profile.dev]
incremental = false
