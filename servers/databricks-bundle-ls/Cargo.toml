[package]
name = "databricks-bundle-ls"
version = "0.2.0"
edition = "2021"
description = "Language server that surfaces `databricks bundle validate` diagnostics"
license = "MIT"
repository = "https://github.com/bartoszgajda55/zed-databricks"

# Standalone crate: the repository root is the Zed extension (compiled to wasm).
[workspace]

[dependencies]
lsp-server = "0.10"
lsp-types = "0.95"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
