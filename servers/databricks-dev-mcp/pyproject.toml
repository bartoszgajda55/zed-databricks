[project]
name = "databricks-dev-mcp"
version = "0.2.0"
description = "MCP server for Databricks development: bundle validate/deploy/run, bundle graph, run status and logs, Unity Catalog lookup, clusters, secret scope names"
readme = "README.md"
authors = [
    { name = "Bartosz Gajda", email = "bartek.g55@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
keywords = ["databricks", "mcp", "declarative-automation-bundles", "spark-declarative-pipelines"]
dependencies = [
    "mcp>=2.2",
    "pydantic>=2",
]

[project.scripts]
databricks-dev-mcp = "databricks_dev_mcp.server:main"

[project.urls]
Repository = "https://github.com/bartoszgajda55/zed-databricks"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
